server.port=8080
server.address=0.0.0.0
spring.application.name=lostlink-backend

# SQLite Database Persistence
spring.datasource.url=jdbc:sqlite:lostlink.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Security
lostlink.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
lostlink.jwt.expiration-ms=86400000

# Campus Geolocation Reference (CGC Jhanjeri)
lostlink.campus.name=CGC University, Jhanjeri, Mohali, Punjab
lostlink.campus.latitude=30.68114
lostlink.campus.longitude=76.60584
lostlink.campus.radius-meters=1000.0

# CORS
lostlink.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
